# CUSTOM: tests the sub2api-custom branch, then builds the image and pushes it
# to GHCR. The image job only runs after every check passes, so a broken commit
# never replaces custom-latest. Upstream workflows (CI / Release / Security
# Scan / CLA) are disabled on this fork in the GitHub Actions settings.
name: Custom Image

on:
  push:
    branches:
      - sub2api-custom
    paths-ignore:
      - '.trellis/**'
      - '.agents/**'
      - '.codex/**'
      - 'openspec/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm run lint:check
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Vitest
        working-directory: frontend
        run: pnpm run test:run

  image:
    needs: [backend-test, backend-lint, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "image=$image"
            echo "short_sha=$short_sha"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            BUILD_TYPE=custom
            COMMIT=${{ steps.meta.outputs.short_sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:custom-latest
            ${{ steps.meta.outputs.image }}:custom-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,scope=custom-image,mode=max

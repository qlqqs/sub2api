# CUSTOM: builds the sub2api-custom image and pushes it to GHCR.
# Upstream workflows (CI / Release / Security Scan / CLA) are disabled on this
# fork in the GitHub Actions settings, so this is the only workflow that runs.
name: Custom Image

on:
  push:
    branches:
      - sub2api-custom
    paths-ignore:
      - '.trellis/**'
      - '.agents/**'
      - '.codex/**'
      - 'openspec/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sub2api"
          short_sha="${GITHUB_SHA::7}"
          {
            echo "image=$image"
            echo "short_sha=$short_sha"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            COMMIT=${{ steps.meta.outputs.short_sha }}
            DATE=${{ steps.meta.outputs.date }}
          tags: |
            ${{ steps.meta.outputs.image }}:custom-latest
            ${{ steps.meta.outputs.image }}:custom-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,scope=custom-image,mode=max
